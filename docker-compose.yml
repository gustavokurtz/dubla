# Banco do histórico de dublagens (só local).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dubla
      POSTGRES_PASSWORD: dubla
      POSTGRES_DB: dubla
    ports:
      - '5433:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data

volumes:
  dados-postgres:
